success_patterns:
  - name: "Upfront metric definitions"
    description: "Define every rate metric with its exact numerator and denominator formula on first use; repeat the definition wherever the metric reappears in the analysis"
    real_example: "Apollo submission defined 'Application Completion Rate = completed_applications / started_applications' in slide 2 before any chart used the metric; the formula appeared again in the appendix methodology section"
    counter_example: "Handshake submission used 'Login Rate' and 'Application Rate' throughout without ever specifying the denominator — was Login Rate per session, per active user, per email sent? Reader cannot audit the numbers"
    check_question: "For each rate or ratio metric in the artifact: is there exactly one place where the formula (numerator / denominator) is stated explicitly? Can every instance of the metric be traced back to that definition?"
    severity_if_missing: "concern"
    tool_integration: "claim-auditor, methodology-critic"

  - name: "Three-part assumption documentation"
    description: "Every data cleaning or preprocessing decision is documented in three parts: (1) observation — what was found in the data, (2) assumption — what was inferred from it, (3) business rationale — why that inference is reasonable in this domain"
    real_example: "Apollo submission: 'Found 3.2% of records with null employer_id (observation) → assumed these were direct-apply flows not routed through employer accounts (assumption) → excluded from employer-side funnel analysis because they do not affect employer renewal metrics (business rationale)'"
    counter_example: "eBay and Handshake submissions documented cleaning steps as one-liners: 'Removed nulls,' 'Filtered to active users,' 'Excluded outliers' — no observation, no assumption, no rationale. A reviewer cannot assess whether the choices were appropriate"
    check_question: "For each data cleaning step: does the documentation contain all three parts (observation, assumption, business rationale)? If a step only says what was done, it fails this check"
    severity_if_missing: "concern"
    tool_integration: "methodology-critic, claim-auditor"

  - name: "TLDR-first slide ordering"
    description: "The first 2 slides after the title contain 3-5 specific, numbered findings with quantified results — before any slide describes the methodology, data, or approach"
    real_example: "Apollo submission opened with a 'Key Findings' slide listing: '(1) Application completion rate fell 18 pp in 6 weeks, (2) Mobile users drove 73% of the drop, (3) Three employer segments show recovery potential' — methodology appeared on slide 5"
    counter_example: "Handshake submission spent slides 2-4 on data description and methodology before any finding appeared; the headline result (25.5% YoY) was buried in slide 6 alongside contradictory numbers"
    check_question: "Do findings with specific numbers appear within the first 2 slides after the title? Is there any methodology, data description, or 'approach' content that precedes the findings summary?"
    severity_if_missing: "concern"
    tool_integration: "storytelling-critic, claim-auditor"

  - name: "Evidence triangulation"
    description: "Every major finding is supported by at least 2 independent metrics measured from different angles before an action is recommended; single-metric findings are explicitly labeled as preliminary or hypothesis-generating"
    real_example: "Apollo finding that 'mobile onboarding is the primary drop-off driver' was supported by: (1) funnel completion rate by device type, (2) session duration on the onboarding step by device, and (3) support ticket volume tagged 'onboarding' segmented by device — three independent signals converging on the same conclusion"
    counter_example: "Handshake Q4 email strategy recommendation was based entirely on Login Rate — a single metric that the submission itself noted was preliminary. No corroborating signal from application starts, session depth, or employer engagement was offered"
    check_question: "For each major finding that leads to a recommendation: how many independent metrics support it? If only one metric is cited, is the finding explicitly flagged as tentative or hypothesis-generating?"
    severity_if_missing: "concern"
    tool_integration: "claim-auditor, methodology-critic"

  - name: "Hedged anomaly acknowledgment"
    description: "Unexpected or surprising patterns in the data are surfaced proactively, given plausible hypotheses using hedged language ('possibly,' 'may be due to,' 'one explanation is'), and neither asserted as facts nor silently omitted"
    real_example: "Apollo submission flagged an unexpected spike in employer churn in February: 'This spike is anomalous relative to the seasonal trend — it may be due to contract renewal timing in Q1, or possibly an artifact of how churned accounts are logged. We recommend investigating before attributing to product factors'"
    counter_example: "eBay submission contained a June anomaly in MC1 that drove the entire pre/post difference. The submission treated it as normal variation and ran the DiD without flagging it. The anomaly was the story — missing it was a critical analytical failure"
    check_question: "Are there any data points, trends, or results that look unusual or contradict expectations? For each: is it explicitly acknowledged? Is a hedged hypothesis offered? Is it neither asserted as fact nor silently dropped?"
    severity_if_missing: "concern"
    tool_integration: "claim-auditor, storytelling-critic"

  - name: "Stakeholder-split recommendations"
    description: "Recommendations are organized into separate sections by audience (e.g., Ops, DS, PM, Eng); each item begins with an imperative verb and a specific action, not a general observation"
    real_example: "Apollo submission structured recommendations as: 'For Product (PM): Redesign the mobile onboarding step 3 CTA — current button placement requires scroll on 375px viewports. For Engineering: Add client-side logging for onboarding step abandonment to enable future funnel analysis. For Data Science: Build a cohort model to separate new-user funnel effects from returning-user seasonality'"
    counter_example: "Handshake Q4 submission listed four bullet recommendations in a single undifferentiated block — no audience labels, no imperative verbs, no specific actions. 'Consider improving email personalization' is neither a stakeholder assignment nor an action"
    check_question: "Are recommendations grouped by audience/stakeholder? Does each item begin with an imperative verb (Redesign, Build, Add, Investigate, Stop)? Does each item specify a concrete action rather than a direction or observation?"
    severity_if_missing: "concern"
    tool_integration: "storytelling-critic, claim-auditor"

  - name: "Linear narrative arc"
    description: "Each slide's finding motivates the next slide's question; the deck reads as a single coherent argument from business question to recommendation, with no slide contradicting a prior slide's conclusion"
    real_example: "Apollo deck: Slide 3 established that overall completion rate fell → Slide 4 asked 'which segment drove this?' and answered 'mobile' → Slide 5 asked 'what specifically breaks on mobile?' and answered 'step 3 CTA' → Slide 6 synthesized the causal chain → Slide 7 recommended fixes in priority order. Each slide's answer became the next slide's question"
    counter_example: "eBay submission had a slide showing null effect (+1.3%) from DiD and a later slide claiming 'the campaign was effective for high-value DMAs' — the two claims were not reconciled and contradicted each other. A reader could not determine the submission's actual conclusion"
    check_question: "Reading only slide headlines in sequence: do they form a coherent argument from question to answer to recommendation? Does any slide's conclusion contradict a conclusion stated on an earlier slide? Does every slide's finding connect to at least one adjacent slide?"
    severity_if_missing: "concern"
    tool_integration: "storytelling-critic"

  # --- Patterns 8-12: From Parafin positive example (2026-04-09) ---

  - name: "Recommendations-first deck structure"
    description: "The first content slide after the title is a complete, audience-segmented recommendation set organized by business objective. The remainder of the deck provides evidence for those recommendations, not discoveries leading toward them."
    real_example: "Parafin submission opened with full recommendations split into 'Overall', 'New Customer Acquisition', and 'Retention' sections, each with specific thresholds and geographic targets. All subsequent slides proved why those recommendations hold."
    counter_example: "Apollo's TLDR slide listed key findings but recommendations appeared on slides 10-11. The deck structure was discovery-mode (findings → recommendations) rather than exec-mode (recommendations → proof)."
    check_question: "Does slide 1 (or slide 2 at latest) contain the complete recommendation set? Can an interviewer read only the first slide and know exactly what actions the analyst recommends, for whom, and under what conditions?"
    severity_if_missing: "concern"
    tool_integration: "storytelling-critic, ai-analyst"

  - name: "Dual-model separation by conversion type"
    description: "When a dataset contains fundamentally different conversion populations (e.g., new vs. returning customers, acquisition vs. retention), separate models are built and presented for each population before combining findings — never conflated into a single model."
    real_example: "Parafin built one XGBoost model targeting first offer funding (new customers, slides 6-8) and a separate XGBoost model for repeat conversions (retention, slides 9-11). Each had its own feature importance ranking and geographic breakdown."
    counter_example: "A submission that builds a single conversion model on the full user base, then segments post-hoc by new vs. returning — conflating acquisition and retention behavioral drivers into one feature space."
    check_question: "Does the dataset contain multiple fundamentally different conversion populations? If so, is a separate model or analysis section presented for each? If a single model is used, is the population-conflation explicitly justified?"
    severity_if_missing: "concern"
    tool_integration: "methodology-critic, ai-analyst"

  - name: "Threshold-anchored recommendations"
    description: "Every recommendation derived from a model or chart states the specific numeric threshold that defines the targeting rule — not a directional heuristic. Thresholds are extracted from inflection points visible in the supporting visualization."
    real_example: "Parafin: 'Target merchants with ≤10 months tenure', 'Consider offer time ranges >13 days', 'Deprioritize merchants with 25+ offers' — all traceable to SHAP inflection points in supporting slides."
    counter_example: "Apollo: 'Redistribute agent supply to match demand curves' and 'Hire more agents in APAC' — directional but not threshold-specific. A PM cannot build a targeting rule from these without additional analysis."
    check_question: "For each recommendation from a model or quantitative analysis: does it include the specific threshold value (a number, boundary, cutoff) that defines the targeting rule? Or is it a directional statement requiring further analysis to operationalize?"
    severity_if_missing: "concern"
    tool_integration: "claim-auditor, reviewer-ds, ai-analyst"

  - name: "Strategic appendix disclosure"
    description: "Model findings that contradict or qualify the main narrative are placed in an appendix slide — surfaced for the curious interviewer but not promoted into the main deck. This is deliberate disclosure, not omission."
    real_example: "Parafin Appendix (Slide 13): 'Widget views showed negative relationship with conversion when accounting for offer views' — directly contradicting the main slides' positive univariate signal. Disclosed but not promoted."
    counter_example: "A submission that omits contradicting findings entirely (hidden), or promotes them to a main slide without resolving the contradiction (confusing). Both are worse than strategic appendix placement."
    check_question: "After completing analysis, are there any findings that contradict main-slide claims? If so, are they disclosed somewhere accessible (appendix, footnote) rather than hidden? Are they kept out of the main flow to avoid narrative derailment?"
    severity_if_missing: "concern"
    tool_integration: "claim-auditor, ai-analyst"

  - name: "Geographic model output chained to resource allocation"
    description: "When geographic analysis is included, the output must produce a prioritized action list — specific markets to enter, defend, or deprioritize — linked directly to the geographic model or chart output. Descriptive breakdowns without allocation implications are insufficient."
    real_example: "Parafin named specific markets from model output: 'Focus on FL, Phoenix, TN, CO' (acquisition) and 'Prioritize NY, Chicago, VA, WA, IN' (retention) — both traceable to geographic feature importance on slides 6 and 9."
    counter_example: "A submission that includes a choropleth showing conversion rates by state but draws no recommendation about which states to prioritize — geographic analysis as visual variety rather than decision input."
    check_question: "If geographic analysis is present: does it produce a named list of markets to prioritize or deprioritize? Does that list appear in the recommendations? Can each named market be traced to a specific chart or model output?"
    severity_if_missing: "concern"
    tool_integration: "reviewer-ds, ai-analyst, claim-auditor"

  # --- Patterns 13-17: From Intuit positive example (2026-04-09) ---

  - name: "Multi-method causal triangulation"
    description: "For any causal claim, show results from ≥3 different estimation methods (e.g., PSM, DML, AIPW, DiD, IV) converging on the same estimate. Include a comparison table showing which methods agree, which fail, and why. The convergence IS the evidence."
    real_example: "Intuit Task 4: 5 methods (naive, regression, PSM, Double ML, Doubly Robust) all converge on 33% ATE with tight CI [0.32, 0.34]. Naive inflated by 6%. Simple regression failed due to multicollinearity. Three valid methods agree → effect is real."
    counter_example: "eBay submission: single CausalImpact run on wrong treatment group. When the method was questioned, there was no corroborating estimate from an alternative method."
    check_question: "If the analysis makes a causal claim: is the same effect estimated by at least 2 additional methods? Do they converge? If they diverge, is the divergence explained?"
    severity_if_missing: "concern"
    tool_integration: "ai-analyst experiment_analysis mode, methodology-critic"

  - name: "Professional credibility lead-in"
    description: "When the format allows (presentation, not just slides), open with a relevant prior project demonstrating transferable skills before presenting the case study. Establishes credibility before the audience evaluates the work."
    real_example: "Intuit slides 2-4: Meta business messaging work (advertiser segmentation, XGBoost + SHAP + causal inference, persona-based GTM) shown before the Intuit case study begins. By slide 5, the interviewer already knows the candidate has done similar work at scale."
    counter_example: "Jumping directly into the case study analysis without any context about the candidate's relevant experience or analytical toolkit."
    check_question: "Does the presentation establish the candidate's relevant experience and analytical toolkit before the case study begins? (Only applicable to presentation-format take-homes, not slide-only submissions.)"
    severity_if_missing: "concern"
    tool_integration: "brainstorm business_model_primer"

  - name: "Scalable framework slide"
    description: "After presenting the analysis, distill the methodology into a reusable framework showing how the approach generalizes to future problems. Shows IC7+ systems thinking — the candidate builds infrastructure, not just one-off analyses."
    real_example: "Intuit slide 4: 'Solution Research Framework' with 4 pillars (advertiser-centric roadmapping, centralized prioritization, standardized validation criteria, integration with Sales/Marketing/Product). Applicable beyond this specific analysis."
    counter_example: "A submission that answers the specific question well but shows no awareness of how the methodology could be reused, scaled, or systematized for future problems."
    check_question: "Does the submission include a slide or section showing how the analytical approach generalizes beyond this specific dataset? Does it describe a reusable framework, not just a one-time analysis?"
    severity_if_missing: "concern"
    tool_integration: "ai-analyst deck_assembly_rules, storytelling-critic"

  - name: "Confounder-explicit causal chain with balance proof"
    description: "For observational causal inference: (1) name the confounder explicitly, (2) explain WHY it confounds (correlated with both treatment and outcome), (3) show the adjustment method, (4) prove balance improved (SMD or other metric before vs after matching/weighting). The full chain must be visible."
    real_example: "Intuit Task 4: 'user motivation' named as confounder → correlated with gadget usage AND conversion → PSM/IPW adjustment → SMD dropped from 0.57 to 0.03. The balance proof is in a table in the appendix."
    counter_example: "Handshake Q2: no confounder identified, no adjustment, no balance check. Pre/post comparison with seasonality as an unmeasured confounder. eBay: treatment assignment via outcome-based t-tests with no confounder discussion."
    check_question: "If the analysis uses observational causal inference: is the confounder named? Is the causal pathway explained? Is the balance between treatment and control shown BEFORE and AFTER adjustment?"
    severity_if_missing: "blocker"
    tool_integration: "reviewer-ds treatment_assignment_probe, ai-analyst experiment_analysis"

  - name: "Channel × funnel stage matrix"
    description: "When analyzing multi-channel marketing or multi-touchpoint data, map each channel to its optimal funnel stage rather than ranking channels overall. Different channels serve different purposes at different stages — a single ranking obscures this."
    real_example: "Intuit slide 6: 'Sales best for paid conversion (but low retention); SEO/PPC for upper funnel activation; other channel has exceptional retention.' Recommendation: 'Focus sales on driving purchases, invest in self-serve channels for post-signup engagement.'"
    counter_example: "A submission that ranks channels by overall conversion rate without considering that Channel A may excel at awareness while Channel B excels at conversion — leading to a recommendation to 'invest more in Channel B' that kills the top of the funnel."
    check_question: "If multiple channels or touchpoints are analyzed: are they mapped to different funnel stages? Does the recommendation differentiate channel roles rather than ranking them uniformly?"
    severity_if_missing: "concern"
    tool_integration: "methodology-critic, ai-analyst"
